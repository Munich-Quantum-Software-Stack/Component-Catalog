name: "Update GitHub Stars and Build"

on:
  schedule:
    - cron: '0 0 * * *' # nightly at 00:00 UTC
  workflow_dispatch: {}

jobs:
  update-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Fetch GitHub stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_stars.py

      - name: Commit updated stars JSON (if changed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/github-stars.json || true
          if ! git diff --staged --quiet --exit-code; then
            git commit -m "chore(ci): update precomputed GitHub stars"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Set up Ruby for Jekyll build
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Jekyll and build site (CI-safe)
        if: always()
        run: |
          # Use Bundler if a Gemfile exists for reproducible installs. Otherwise
          # install into the user gem dir to avoid system write permissions.
          if [ -f Gemfile ]; then
            gem install --no-document bundler || true
            bundle install --jobs 4 --retry 3 --path vendor/bundle
            bundle exec jekyll build || true
          else
            gem install --user-install --no-document jekyll bundler || true
            export PATH="$(ruby -rubygems -e 'puts Gem.user_dir')/bin:$PATH"
            jekyll build || true
          fi
