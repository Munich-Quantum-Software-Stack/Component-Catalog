name: "Update GitHub Stars and Build"

on:
  schedule:
    - cron: '0 0 * * *' # nightly at 00:00 UTC
  workflow_dispatch: {}

jobs:
  update-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Fetch GitHub stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_stars.py

      - name: Commit updated stars JSON (if changed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/github-stars.json || true
          if ! git diff --staged --quiet --exit-code; then
            git commit -m "chore(ci): update precomputed GitHub stars"
            git push
          else
            echo "No changes to commit"
          fi

      - name: "Optional: build site with Jekyll"
        if: always()
        run: |
          # Try a minimal jekyll build so artifacts are validated. If your project
          # requires Bundler or a specific Ruby, replace this with your existing
          # build step (bundle exec jekyll build).
          gem install bundler jekyll || true
          if command -v jekyll >/dev/null 2>&1; then
            jekyll build || true
          else
            echo "jekyll not available, skipping build"
          fi
