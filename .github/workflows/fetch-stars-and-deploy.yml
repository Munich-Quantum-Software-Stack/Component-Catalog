# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Fetch GitHub Stars and Deploy Webpage with Jekyll

on:
  # Runs on a schedule (nightly)
  schedule:
    - cron: "0 0 * * *" # nightly at 00:00 UTC
  push:
    branches: ["develop"]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Fetch GitHub stars
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch_stars.py
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
      - name: Deploy Preview (only for PRs)
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: ./_site/
      - name: Deploy to GitHub Pages (only on develop branch)
        if: github.ref == 'refs/heads/develop' && github.event.action != 'closed'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: _site
          clean-exclude: pr-preview/
          force: false
